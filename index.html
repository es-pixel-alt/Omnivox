<!doctype html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a5c">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-able" content="yes">
<meta name="mobile-web-app-able" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omnivox">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Omnivox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
/* Mise en page : en-tête marine collant + bandeau « démo », contenu en cartes, navigation à 5 onglets
   (barre du bas sur téléphone, rail à gauche sur grand écran). Thème clair, accents bleu foncé. */
:root {
  --bg: #f1f5fb;
  --surface: #ffffff;
  --ink: #0e1b33;
  --muted: #56667f;
  --line: #dbe3ef;
  --navy: #0d2a5c;
  --navy-2: #173a7a;
  --blue: #2a63cf;
  --sky: #e5edfb;
  --ok: #1b7f55;
  --ok-soft: #dcf3e7;
  --warn-ink: #8a5a00;
  --warn-soft: #fff1cf;
  --bad: #b83a1f;
  --bad-soft: #fbe2dc;
  --c-ang: #2a63cf;
  --c-phy: #0c8486;
  --c-mic: #c1560d;
  --f-display: "Schibsted Grotesk", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 62px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 28px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
.svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.svg.sm { width: 16px; height: 16px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* En-tête */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background: var(--navy); color: #fff;
}
.top-in { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; border: 0; background: none; color: #fff; padding: 0; }
.brand svg { width: 30px; height: 30px; }
.top .grow { flex: 1; min-width: 0; }
.top h1 { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; position: relative; }
.icon-btn:hover { background: rgba(255,255,255,.22); }
.avatar { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: #fff; color: var(--navy); }
.demo-strip { background: var(--warn-soft); color: var(--warn-ink); font-size: 12px; font-weight: 600; text-align: center; padding: 4px 16px; letter-spacing: .01em; }

.wrap { max-width: 1180px; margin: 0 auto; }
.main { padding-top: 16px; display: grid; gap: 18px; }

/* Navigation */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
.nav button[aria-current="page"] { color: var(--navy); }
.nav button[aria-current="page"] .svg { stroke-width: 2.4; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--navy); }
.badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

/* Cartes et blocs */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.sec { display: grid; gap: 10px; min-width: 0; }
.sec > h2 { font-size: 19px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec > h2 .more { font-family: var(--f-body); font-size: 13px; font-weight: 600; color: var(--blue); background: none; border: 0; padding: 0; }
.cols { display: grid; gap: 18px; min-width: 0; }
.stack { display: grid; gap: 18px; align-content: start; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row.between { justify-content: space-between; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--sky); color: var(--navy); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.navy { background: var(--navy); color: #fff; }

/* Accueil */
.hero { background: var(--navy); color: #fff; border-radius: 14px; padding: 18px 18px 16px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; bottom: -34px; width: 170px; height: 170px; background: radial-gradient(circle at 50% 50%, transparent 0 36%, rgba(255,255,255,.07) 36% 38%, transparent 38% 52%, rgba(255,255,255,.07) 52% 54%, transparent 54% 68%, rgba(255,255,255,.07) 68% 70%, transparent 70%); pointer-events: none; }
.hero .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #aac1ec; }
.hero h2 { font-size: clamp(24px, 6vw, 32px); margin-top: 3px; }
.hero p { color: #cfdcf6; margin-top: 4px; font-size: 14px; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hero .pill { background: rgba(255,255,255,.14); color: #fff; }

.next { display: grid; gap: 10px; }
.next .when { font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--navy); letter-spacing: -0.02em; }
.cbar { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
.cls { display: flex; gap: 12px; min-width: 0; }
.cls .t { font-weight: 700; }
.cls .s { color: var(--muted); font-size: 13.5px; }
.cls.off { opacity: .55; }
.cls.off .t { text-decoration: line-through; }
.tl { display: grid; gap: 12px; }
.tl .time { width: 46px; flex: none; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); font-weight: 600; }
.item-btn { width: 100%; text-align: left; background: none; border: 0; padding: 0; display: flex; gap: 12px; align-items: center; min-width: 0; }

.evt { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.evt:first-child { border-top: 0; }
.evt:hover { background: #f7f9fd; }
.date-chip { width: 46px; flex: none; text-align: center; border-radius: 8px; background: var(--sky); color: var(--navy); padding: 4px 0 5px; line-height: 1.1; }
.date-chip b { display: block; font-family: var(--f-display); font-size: 19px; }
.date-chip span { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.date-chip.eval { background: var(--bad-soft); color: var(--bad); }
.date-chip.exam { background: var(--bad); color: #fff; }
.date-chip.perso { background: var(--ok-soft); color: var(--ok); }
.evt .grow, .msg .grow { flex: 1; min-width: 0; }
.evt .t, .msg .t { font-weight: 600; overflow-wrap: anywhere; }
.evt .s, .msg .s { font-size: 13px; color: var(--muted); }
.chev { color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile:hover { border-color: var(--navy-2); }
.tile .code { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.tile .big { font-family: var(--f-display); font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1; }
.tile .nm { font-size: 12.5px; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
.meter { height: 6px; border-radius: 3px; background: var(--sky); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }

.rcard { background: linear-gradient(0deg, var(--navy-2), var(--navy)); color: #fff; border-radius: 12px; padding: 16px; text-align: left; border: 0; display: grid; gap: 6px; width: 100%; }
.rcard .lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #aac1ec; }
.rcard .num { font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.rcard .sub { color: #cfdcf6; font-size: 13px; }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.quick button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 4px 10px; display: grid; justify-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--navy); text-align: center; line-height: 1.2; }
.quick button:hover { border-color: var(--navy-2); background: var(--sky); }

.notice { padding: 13px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; display: grid; gap: 3px; }
.notice:first-child { border-top: 0; }
.notice .t { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notice .b { color: var(--muted); font-size: 14px; }
.notice .b[hidden] { display: none; }

/* Messages */
.msg { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.msg:first-child { border-top: 0; }
.msg:hover { background: #f7f9fd; }
.msg.unread .t { font-weight: 800; }
.msg .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); flex: none; }
.msg .dot.read { background: transparent; }
.msg .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; color: #fff; flex: none; font-size: 14px; }
.msg .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbody { white-space: pre-line; line-height: 1.6; }

/* Segments, onglets, champs */
.seg { display: flex; gap: 4px; background: #e3eaf6; border-radius: 10px; padding: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--navy); box-shadow: 0 1px 2px rgba(13,42,92,.15); }
.chipbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chipbar::-webkit-scrollbar { display: none; }
.chipbar button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chipbar button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 700; color: var(--navy); }
.in, select.in, textarea.in { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid #c3cfe2; border-radius: 9px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea.in { min-height: 110px; resize: vertical; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; background: var(--navy); color: #fff; text-align: center; }
.btn:hover { background: var(--navy-2); }
.btn.alt { background: var(--sky); color: var(--navy); }
.btn.alt:hover { background: #d4e0f6; }
.btn.bad { background: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.search { position: relative; }
.search .svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--muted); width: 18px; height: 18px; }
.search .in { padding-left: 38px; }

/* Services */
.sgroup h3 { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .02em; margin: 0 0 8px; }
.sgrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.sbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; display: flex; gap: 12px; align-items: center; min-width: 0; }
.sbtn:hover { border-color: var(--navy-2); }
.sbtn .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--sky); color: var(--navy); display: grid; place-items: center; flex: none; }
.sbtn.urg .ico { background: var(--bad-soft); color: var(--bad); }
.sbtn .t { font-weight: 700; line-height: 1.2; }
.sbtn .s { font-size: 12.5px; color: var(--muted); line-height: 1.25; }

.kv { display: grid; }
.kv > div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 14px; border-top: 1px solid var(--line); }
.kv > div:first-child { border-top: 0; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.note { background: var(--sky); border-radius: 10px; padding: 12px 14px; color: var(--navy); font-size: 14px; }
.note.warn { background: var(--warn-soft); color: var(--warn-ink); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.listrow { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); min-width: 0; }
.listrow:first-child { border-top: 0; }
.listrow .grow { flex: 1; min-width: 0; }
.listrow .t { font-weight: 600; overflow-wrap: anywhere; }
.listrow .s { font-size: 13px; color: var(--muted); }
.right { text-align: right; flex: none; }
.toggle { width: 46px; height: 28px; border-radius: 14px; border: 0; background: #b9c6dc; position: relative; flex: none; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--navy); }
.toggle[aria-checked="true"]::after { transform: translateX(18px); }

/* Horaire */
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.days button { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 0; display: grid; justify-items: center; line-height: 1.15; font-size: 12px; color: var(--muted); font-weight: 600; }
.days button b { font-family: var(--f-display); font-size: 18px; color: var(--ink); }
.days button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #cfdcf6; }
.days button[aria-pressed="true"] b { color: #fff; }
.days button.today b::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); margin: 1px auto 0; }
.days button.free { opacity: .65; }
.grid-wrap { overflow-x: auto; }
.wk { display: grid; grid-template-columns: 38px repeat(5, minmax(0, 1fr)); gap: 0; min-width: 320px; position: relative; }
.wk .hh { font-size: 10.5px; color: var(--muted); text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }
.wk .colh { text-align: center; font-size: 12px; font-weight: 700; padding: 6px 0; color: var(--navy); }
.wk .colh.today { color: var(--blue); }
.wk .col { position: relative; border-left: 1px solid var(--line); height: 330px; background: repeating-linear-gradient(0deg, transparent 0 59px, #edf1f8 59px 60px); }
.blk { position: absolute; left: 2px; right: 2px; border-radius: 6px; color: #fff; padding: 4px 5px; font-size: 11px; font-weight: 700; line-height: 1.2; text-align: left; border: 0; overflow: hidden; }
.blk small { display: block; font-weight: 500; opacity: .9; font-size: 10px; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.month .dow { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding: 4px 0; }
.month .day { aspect-ratio: 1 / 1.05; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; display: grid; align-content: space-between; justify-items: center; padding: 4px 0 5px; font-weight: 600; font-size: 14px; min-width: 0; }
.month .day.out { opacity: .35; }
.month .day.today { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.month .day[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }

/* Notes */
.cour-head { border-radius: 14px; color: #fff; padding: 18px; display: grid; gap: 6px; }
.cour-head .big { font-family: var(--f-display); font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.cour-head p { opacity: .92; font-size: 14px; }
.evrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.evrow:first-child { border-top: 0; }
.evrow .t { font-weight: 600; overflow-wrap: anywhere; }
.evrow .s { font-size: 13px; color: var(--muted); }
.evrow .g { font-family: var(--f-display); font-weight: 700; font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.evrow .g.pend { font-size: 13px; color: var(--muted); font-family: var(--f-body); font-weight: 600; }
.slider { width: 100%; accent-color: var(--navy); }
.big-out { font-family: var(--f-display); font-size: 40px; font-weight: 700; color: var(--navy); line-height: 1; }
.sess { border-top: 1px solid var(--line); }
.sess:first-child { border-top: 0; }
.sess > button { width: 100%; background: none; border: 0; display: flex; align-items: center; gap: 10px; padding: 14px; text-align: left; }
.sess .grow { flex: 1; min-width: 0; }
.sess .t { font-weight: 700; }
.sess .rot { transition: transform .15s; }
.sess[data-open="1"] .rot { transform: rotate(90deg); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 8px; background: #f6f8fc; }
.tbl td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl th.n, .tbl td.n { text-align: right; }
.tbl-wrap { overflow-x: auto; }
.gauge { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #cdd9ee, #6f93d6 70%, var(--navy)); margin: 26px 0 22px; }
.gauge .mark { position: absolute; top: -8px; width: 4px; height: 28px; background: var(--ink); border-radius: 2px; translate: -2px 0; }
.gauge .mark span { position: absolute; bottom: 31px; left: 50%; translate: -50% 0; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.gauge .tick { position: absolute; top: 18px; font-size: 11px; color: var(--muted); translate: -50% 0; font-variant-numeric: tabular-nums; }
.spark { width: 100%; height: auto; display: block; }

/* Feuille modale et toast */

.sheet { background: var(--surface); width: min(100%, 560px); max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; }

    if (a === "dir") { var q2 = el.value.toLowerCase(); var r = DIR.filter(function (d) { return d.join(" ").toLowerCase().indexOf(q2) > -1; }); document.getElementById("dirlist").innerHTML = r.length ? lst(r.map(function (d) { return lr(d[0], "Local " + d[2], d[1]); })) : '<div class="card empty">Aucun résultat.</div>'; }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target, a = el.getAttribute("data-act");

  });

  /* Démarrage */
  try { var h = (location.hash || "").replace("#", ""); if (h) { var i = h.indexOf("-"), r = i > -1 ? h.slice(0, i) : h, p = i > -1 ? h.slice(i + 1) : null; if (PAGES[r]) { S.route = r; S.param = p; } } } catch (e) {}
  render(false);
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) { window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); }); }
})();
